name: Darino Verification

on:
  push:
    branches:
      - hardening/world-class-baseline
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Android compile
        run: ./gradlew :app:assembleDebug --stacktrace

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Backend compile
        working-directory: backend
        run: ./gradlew compileKotlin --stacktrace
