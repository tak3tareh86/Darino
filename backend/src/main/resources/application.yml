server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    context-path: /

spring:
  application:
    name: finance-auto-reminder-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:finance_db}?sslmode=${DB_SSL_MODE:prefer}}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 25
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  task:
    scheduling:
      pool:
        size: 5

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000} # 15 minutes
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
    issuer: finance-manager-auth
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:*}
  sms:
    provider: ${SMS_PROVIDER:mock}
    api-base-url: ${SMS_API_BASE_URL:https://api.kavenegar.com/v1}
    api-key: ${SMS_API_KEY:${KAVENEGAR_API_KEY:${FARAZSMS_API_KEY:}}}
    api-secret: ${SMS_API_SECRET:}
    username: ${SMS_USERNAME:}
    password: ${SMS_PASSWORD:}
    sender: ${SMS_SENDER:+9830000000}
    webhook-secret: ${SMS_WEBHOOK_SECRET:default_webhook_secret}
    queue:
      max-retry-attempts: 4
      initial-backoff-ms: 10000
      backoff-multiplier: 2.5
      poll-interval-ms: 5000
    patterns:
      otp: ${SMS_PATTERN_OTP:otp_verify_code}
      installment: ${SMS_PATTERN_INSTALLMENT:installment_reminder}
      vehicle: ${SMS_PATTERN_VEHICLE:vehicle_reminder}
      general: ${SMS_PATTERN_GENERAL:general_reminder}
  phone:
    otp:
      expiration-seconds: 180 # 3 minutes
      resend-cooldown-seconds: 60
      max-attempts: 5
      rate-limit-per-hour: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    root: INFO
    com.financemanager: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
